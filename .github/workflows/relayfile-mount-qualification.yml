name: Relayfile mount qualification

on:
  push:
    branches:
      - main

concurrency:
  group: relayfile-mount-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.22.12"

jobs:
  build:
    name: Build and attest relayfile-mount
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact push commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert checkout is the pushed commit
        run: |
          test "$GITHUB_REPOSITORY" = "AgentWorkforce/relayfile"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve source release version
        run: echo "RELAYFILE_VERSION=$(jq -r .version packages/cli/package.json)" >> "$GITHUB_ENV"

      - name: Build exact Linux amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p qualification
          go build -trimpath -ldflags "-s -w -X main.relayfileMountVersion=${RELAYFILE_VERSION}" \
            -o qualification/relayfile-mount-linux-amd64 ./cmd/relayfile-mount
          test -f qualification/relayfile-mount-linux-amd64
          test ! -L qualification/relayfile-mount-linux-amd64
          test -x qualification/relayfile-mount-linux-amd64
          test "$(qualification/relayfile-mount-linux-amd64 --version)" = "$RELAYFILE_VERSION"

      - name: Upload canonical binary artifact
        id: binary
        uses: actions/upload-artifact@v4
        with:
          name: relayfile-mount-qualification-linux-amd64
          path: qualification/relayfile-mount-linux-amd64
          if-no-files-found: error
          retention-days: 14

      - name: Write canonical attestation
        env:
          BINARY_ARTIFACT_DIGEST: ${{ steps.binary.outputs.artifact-digest }}
        run: |
          FILE_SHA256=$(sha256sum qualification/relayfile-mount-linux-amd64 | cut -d' ' -f1)
          export FILE_SHA256
          node -e 'const fs=require("node:fs"); const a={schemaVersion:1,kind:"relayfileMount",producer:{repository:process.env.GITHUB_REPOSITORY,workflow:"Relayfile mount qualification",workflowPath:".github/workflows/relayfile-mount-qualification.yml",event:"push",ref:"main",sourceGitSha:process.env.GITHUB_SHA,runId:String(process.env.GITHUB_RUN_ID),runAttempt:String(process.env.GITHUB_RUN_ATTEMPT)},payload:{artifact:"relayfile-mount-qualification-linux-amd64",artifactDigest:process.env.BINARY_ARTIFACT_DIGEST,file:"relayfile-mount-linux-amd64",fileSha256:process.env.FILE_SHA256},release:{version:"v"+process.env.RELAYFILE_VERSION}}; if(a.producer.repository!=="AgentWorkforce/relayfile") throw new Error("non-canonical producer repository"); if(!/^[0-9a-f]{64}$/.test(a.payload.artifactDigest)) throw new Error("invalid artifact digest"); fs.writeFileSync("qualification/relayfile-mount-qualification-attestation.json",JSON.stringify(a,null,2)+"\n")'

      - name: Upload canonical attestation artifact
        id: attestation
        uses: actions/upload-artifact@v4
        with:
          name: relayfile-mount-qualification-attestation
          path: qualification/relayfile-mount-qualification-attestation.json
          if-no-files-found: error
          retention-days: 14

      - name: Emit consumer request
        run: |
          {
            echo "## Relayfile mount consumer request"
            echo
            echo '```json'
            node -e 'console.log(JSON.stringify({runId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),attestationArtifactDigest:process.env.ATTESTATION_DIGEST},null,2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ATTESTATION_DIGEST: ${{ steps.attestation.outputs.artifact-digest }}

  verify:
    name: Verify downloaded immutable artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact push commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: relayfile-mount-qualification-linux-amd64
          path: qualification

      - name: Download attestation artifact
        uses: actions/download-artifact@v4
        with:
          name: relayfile-mount-qualification-attestation
          path: qualification

      - name: Resolve expected source release version
        run: echo "RELAYFILE_VERSION=$(jq -r .version packages/cli/package.json)" >> "$GITHUB_ENV"

      - name: Verify artifact shape, provenance, digest, and smoke command
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          EXPECTED_VERSION="$RELAYFILE_VERSION"
          binary=qualification/relayfile-mount-linux-amd64
          attest=qualification/relayfile-mount-qualification-attestation.json
          test -f "$binary" && test ! -L "$binary"
          chmod 755 "$binary"
          test -x "$binary"
          test -f "$attest" && test ! -L "$attest"
          test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$(jq -r .payload.fileSha256 "$attest")"
          jq -e --arg sha "$EXPECTED_SHA" --arg run "$EXPECTED_RUN_ID" --arg attempt "$EXPECTED_RUN_ATTEMPT" --arg version "v$EXPECTED_VERSION" '
            .schemaVersion == 1 and .kind == "relayfileMount" and
            .producer.repository == "AgentWorkforce/relayfile" and
            .producer.workflow == "Relayfile mount qualification" and
            .producer.workflowPath == ".github/workflows/relayfile-mount-qualification.yml" and
            .producer.event == "push" and .producer.ref == "main" and
            .producer.sourceGitSha == $sha and .producer.runId == $run and
            .producer.runAttempt == $attempt and .release.version == $version and
            .payload.artifact == "relayfile-mount-qualification-linux-amd64" and
            .payload.file == "relayfile-mount-linux-amd64" and
            (.payload.artifactDigest | test("^[0-9a-f]{64}$")) and
            (.payload.fileSha256 | test("^[0-9a-f]{64}$"))
          ' "$attest"
          test "$("$binary" --version)" = "$EXPECTED_VERSION"
          "$binary" --help >/tmp/relayfile-mount-help.txt 2>&1
          test -s /tmp/relayfile-mount-help.txt
