name: Contract

on:
  pull_request:
    # Trunk -> main promotion PR only, batched by the merge train (AgentWorkforce/cloud
    # packages/web/lib/merge-train): opened, reopened, or the sweeper's `ci:run`
    # label once per new trunk head. Never on synchronize; other label events
    # skip every job.
    types: [opened, reopened, labeled]
  push:
    branches:
      - main

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: contract-${{ github.event_name != 'pull_request' && format('push-{0}', github.sha) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'ci:run'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SDK deps
        working-directory: packages/sdk/typescript
        run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Build SDK
        working-directory: packages/sdk/typescript
        run: npm run build

      - name: Validate contract surface
        run: ./scripts/check-contract-surface.sh

      - name: Validate mount qualification producer contract
        run: |
          node --test scripts/validate-mount-qualification-workflow.test.mjs
          node scripts/validate-mount-qualification-workflow.mjs

      - name: Validate protected release workflows
        run: |
          ./scripts/check-publish-workflow.sh
          ./scripts/check-publish-workflow.sh .github/workflows/publish-python.yml
          ./scripts/test-check-publish-workflow.sh
