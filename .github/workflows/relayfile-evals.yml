name: Relayfile Evals

on:
  pull_request:
    # Trunk -> main promotion PR only, batched by the merge train (AgentWorkforce/cloud
    # packages/web/lib/merge-train): opened, reopened, or the sweeper's `ci:run`
    # label once per new trunk head. Never on synchronize; other label events
    # skip every job.
    types: [opened, reopened, labeled]
    paths:
      - ".github/workflows/relayfile-evals.yml"
      - "AGENTS.md"
      - "README.md"
      - "cmd/**"
      - "docs/**"
      - "evals/**"
      - "internal/**"
      - "openapi/**"
      - "packages/**"
      - "schemas/**"
      - "scripts/evals/**"
      - "testdata/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/relayfile-evals.yml"
      - "AGENTS.md"
      - "README.md"
      - "cmd/**"
      - "docs/**"
      - "evals/**"
      - "internal/**"
      - "openapi/**"
      - "packages/**"
      - "schemas/**"
      - "scripts/evals/**"
      - "testdata/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: relayfile-evals-${{ github.event_name != 'pull_request' && format('push-{0}', github.sha) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "22"
  NPM_CONFIG_FUND: "false"
  RELAYFILE_EVAL_OPENROUTER_MODEL: openai/gpt-oss-120b:free

jobs:
  evals:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'ci:run'))
    name: Provider-backed evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Relayfile packages
        run: npm run build

      - name: Require OpenRouter API key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY GitHub secret is required for provider-backed Relayfile evals."
            exit 1
          fi

      - name: Run provider evals
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run evals:provider -- --suite provider-readiness --trials 1

      - name: Summarize evals
        if: always()
        run: node scripts/evals/ci-summary.mjs

      - name: Comment human-review cases
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/evals/ci-review-comment.mjs

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relayfile-eval-run
          path: .relayfile/evals/runs/
          retention-days: 14
          if-no-files-found: ignore
