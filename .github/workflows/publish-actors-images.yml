name: Publish Actors Images

# Publishes the two images for self-hosting relayfile on durable-actors to GHCR:
#   relayfile-actors            docker/actors.Dockerfile            (gateway, session-broker)
#   relayfile-actors-workspace  docker/actors-workspace.Dockerfile  (Workspace actor, deploy)
#
# Manual only, like publish.yml: publishing runs only when a maintainer starts
# it (CONTRIBUTING.md). Images ship to self-hosters, so a dispatch publishes
# only from main or from the exact release tag v<package.json version>, never
# from a PR branch. Tags: sha-<short> always, plus <version> on a release-tag
# build (SemVer build metadata "+" becomes "-", since OCI tags cannot hold "+").
# Both images push under sha-<short> first; the <version> tags are added by
# digest only after both images are pushed (and the attest steps finish), so a
# version tag never points at a release whose other image failed to build.
# The two tag writes are separate registry calls (OCI has no cross-repository
# transaction); each is retried, and a run that still fails is safe to
# re-dispatch on the same tag. Retagging by digest keeps the same digest.
# Actions are pinned to commit SHAs: this job can write packages.
#
# NOTE: a package created by Actions starts PRIVATE even from a public repo.
# After the first successful run, set each package to public once in
# Settings → Packages → <name> → Change visibility.

on:
  workflow_dispatch:

concurrency:
  group: publish-actors-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build and push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A tag build must be the release tag of the version in package.json, not any v* tag.
      - name: Resolve image tags
        id: meta
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::7}"
          version="$(node -p "require('./package.json').version")"
          release=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF" != "refs/tags/v${version}" ]; then
              echo "ref $GITHUB_REF is not the release tag v${version}" >&2
              exit 1
            fi
            # OCI tags are [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}; SemVer build metadata uses "+".
            release="${version//+/-}"
            if ! printf '%s' "$release" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "version $version does not map to a valid image tag" >&2
              exit 1
            fi
          fi
          {
            echo "owner=${owner}"
            echo "short=${short}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push relayfile-actors
        id: gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/actors.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/relayfile-actors:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=relayfile gateway and session-broker for durable-actors

      - name: Build and push relayfile-actors-workspace
        id: workspace
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/actors-workspace.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/relayfile-actors-workspace:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=relayfile Workspace actor and deployer for durable-actors

      # Artifact attestations are unavailable on private repositories (a GitHub
      # limitation), so only there a failed attestation does not fail the publish.
      - name: Attest relayfile-actors
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/relayfile-actors
          subject-digest: ${{ steps.gateway.outputs.digest }}
          push-to-registry: true

      - name: Attest relayfile-actors-workspace
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner }}/relayfile-actors-workspace
          subject-digest: ${{ steps.workspace.outputs.digest }}
          push-to-registry: true

      # Only now, with both images pushed and attested, point the release tags at them.
      - name: Tag the release
        if: steps.meta.outputs.release != ''
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          RELEASE: ${{ steps.meta.outputs.release }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          WORKSPACE_DIGEST: ${{ steps.workspace.outputs.digest }}
        run: |
          set -euo pipefail
          # Both source images already exist by digest; retry transient registry errors.
          promote() {
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create -t "$1" "$2"; then return 0; fi
              echo "retagging $1 failed (attempt $attempt)" >&2
              sleep $((attempt * 5))
            done
            echo "::error::could not tag $1; re-dispatch this workflow on ${GITHUB_REF} to finish the release" >&2
            return 1
          }
          promote "ghcr.io/${OWNER}/relayfile-actors:${RELEASE}" "ghcr.io/${OWNER}/relayfile-actors@${GATEWAY_DIGEST}"
          promote "ghcr.io/${OWNER}/relayfile-actors-workspace:${RELEASE}" "ghcr.io/${OWNER}/relayfile-actors-workspace@${WORKSPACE_DIGEST}"

      - name: Report the immutable references
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          SHORT: ${{ steps.meta.outputs.short }}
          RELEASE: ${{ steps.meta.outputs.release }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          WORKSPACE_DIGEST: ${{ steps.workspace.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo '```'
            for image in relayfile-actors relayfile-actors-workspace; do
              echo "ghcr.io/${OWNER}/${image}:sha-${SHORT}"
              if [ -n "$RELEASE" ]; then echo "ghcr.io/${OWNER}/${image}:${RELEASE}"; fi
            done
            echo "ghcr.io/${OWNER}/relayfile-actors@${GATEWAY_DIGEST}"
            echo "ghcr.io/${OWNER}/relayfile-actors-workspace@${WORKSPACE_DIGEST}"
            echo '```'
            echo
            echo "Pin the digests, not the tags: a tag can be moved, a digest cannot."
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Source commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
