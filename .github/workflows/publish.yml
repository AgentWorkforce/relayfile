name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - all
          - core
          - sdk
          - client
          - agents
          - cli
          - file-observer
          - local-mount
          - mount-darwin-arm64
          - mount-darwin-x64
          - mount-linux-arm64
          - mount-linux-x64
        default: "all"
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      custom_version:
        description: "Custom version (optional, overrides version type)"
        required: false
        type: string
      preid:
        description: "Prerelease identifier (used with pre* version types)"
        required: false
        type: choice
        options:
          - beta
          - alpha
          - rc
        default: "beta"
      dry_run:
        description: "Dry run (do not actually publish)"
        required: false
        type: boolean
        default: false
      tag:
        description: "NPM dist-tag"
        required: false
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha
        default: "latest"

concurrency:
  group: publish-package
  cancel-in-progress: false

env:
  NPM_CONFIG_FUND: false

jobs:
  # Build all packages once, version them, and upload
  build:
    name: Build & Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      is_prerelease: ${{ steps.bump.outputs.is_prerelease }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      release_package: ${{ steps.inputs.outputs.package }}
      release_dry_run: ${{ steps.inputs.outputs.dry_run }}

    steps:
      - name: Validate and map dispatch inputs
        id: inputs
        env:
          PACKAGE_INPUT: ${{ github.event.inputs.package }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$PACKAGE_INPUT" in
            all|core|sdk|client|agents|cli|file-observer|local-mount|mount-darwin-arm64|mount-darwin-x64|mount-linux-arm64|mount-linux-x64)
              RELEASE_PACKAGE="$PACKAGE_INPUT"
              ;;
            *)
              echo "Unsupported package input" >&2
              exit 1
              ;;
          esac
          case "$DRY_RUN_INPUT" in
            true|false) RELEASE_DRY_RUN="$DRY_RUN_INPUT" ;;
            *) echo "Invalid dry_run input" >&2; exit 1 ;;
          esac
          echo "package=$RELEASE_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$RELEASE_DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "RELEASE_PACKAGE=$RELEASE_PACKAGE" >> "$GITHUB_ENV"
          echo "RELEASE_DRY_RUN=$RELEASE_DRY_RUN" >> "$GITHUB_ENV"

      - name: Validate release mode
        run: |
          set -euo pipefail
          if [ "$RELEASE_PACKAGE" != "all" ] && [ "$RELEASE_DRY_RUN" != "true" ]; then
            cat >&2 <<'EOF'
          ERROR: the publish workflow version-bumps every @relayfile package, and
          release lockfile regeneration needs every @relayfile/mount-* package at
          the new version to have been published so npm can resolve tarball
          integrity metadata. Run the release with package=all, or split
          single-package releases into a workflow that does not rewrite all
          package manifests and lockfiles.
          EOF
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable source snapshot
        id: source
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Building immutable source snapshot $SOURCE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Check SDK parity
        run: node scripts/check-sdk-parity.mjs

      - name: Version all packages
        id: bump
        env:
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          VERSION_TYPE: ${{ github.event.inputs.version }}
          PREID: ${{ github.event.inputs.preid }}
          NPM_TAG: ${{ github.event.inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          case "$VERSION_TYPE" in
            patch|minor|major|prepatch|preminor|premajor|prerelease) ;;
            *)
              echo "Invalid version bump type: $VERSION_TYPE" >&2
              exit 1
              ;;
          esac
          case "$PREID" in
            beta|alpha|rc) ;;
            *)
              echo "Invalid prerelease identifier: $PREID" >&2
              exit 1
              ;;
          esac
          case "$NPM_TAG" in
            latest|next|beta|alpha) ;;
            *)
              echo "Invalid npm dist-tag: $NPM_TAG" >&2
              exit 1
              ;;
          esac

          if [ -n "$CUSTOM_VERSION" ]; then
            CUSTOM_VERSION="$CUSTOM_VERSION" node <<'NODE'
          const candidate = process.env.CUSTOM_VERSION ?? "";
          const number = "(0|[1-9]\\d*)";
          const prerelease =
            "(0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)";
          const build = "[0-9A-Za-z-]+";
          const strictSemVer = new RegExp(
            `^${number}\\.${number}\\.${number}` +
              `(?:-${prerelease}(?:\\.${prerelease})*)?` +
              `(?:\\+${build}(?:\\.${build})*)?$`,
          );
          if (
            !strictSemVer.test(candidate) ||
            /[\r\n\u2028\u2029]/.test(candidate)
          ) {
            console.error(
              "Invalid custom_version (must be a strict SemVer release): " +
                candidate,
            );
            process.exit(1);
          }
          NODE
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Release commits are tagged in Create Release but intentionally are
          # not pushed back to the source branch.  Resolve the highest
          # strictly-attested release tag reachable from this dispatch before
          # applying a bump, otherwise the next dispatch would repeat the
          # previous version.  A rerun of the same workflow attempt reuses an
          # already-created tag instead of advancing past its target.
          SOURCE_SHA="${SOURCE_SHA:-}"
          BASELINE_VERSION="$CURRENT_VERSION"
          RESUMABLE_VERSION=""
          if [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BASELINE_INFO=$(node "${GITHUB_WORKSPACE:-.}/scripts/release/resolve-release-baseline.mjs" \
              --source-sha "$SOURCE_SHA" \
              --cwd "$PWD" \
              --current-version "$CURRENT_VERSION")
            BASELINE_VERSION=$(printf '%s\n' "$BASELINE_INFO" | awk -F= '$1 == "baseline_version" { print $2 }')
            RESUMABLE_VERSION=$(printf '%s\n' "$BASELINE_INFO" | awk -F= '$1 == "resumable_version" { print $2 }')
            test -n "$BASELINE_VERSION"
            echo "Trusted release baseline: $BASELINE_VERSION"
          fi

          # Every workspace package this release publishes. Used both by the
          # collision guard below and by the version-sync script, so the two can
          # never disagree about what a release covers.
          PACKAGE_PATHS_JSON='[
            "packages/core/package.json",
            "packages/sdk/typescript/package.json",
            "packages/client/package.json",
            "packages/agents/package.json",
            "packages/cli/package.json",
            "packages/file-observer/package.json",
            "packages/local-mount/package.json",
            "packages/mount-darwin-arm64/package.json",
            "packages/mount-darwin-x64/package.json",
            "packages/mount-linux-arm64/package.json",
            "packages/mount-linux-x64/package.json"
          ]'

          if [ -n "$CUSTOM_VERSION" ]; then
            echo "Setting version to custom value: $CUSTOM_VERSION"
            # npm version does not support a `--` separator; strict SemVer
            # validation above rejects option-shaped values before this call.
            npm version "$CUSTOM_VERSION" --no-git-tag-version --allow-same-version
          else
            BASELINE_VERSION="$BASELINE_VERSION" node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.version = process.env.BASELINE_VERSION;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            '
            RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT:-1}"
            if [ "$RUN_ATTEMPT" -gt 1 ] && [ -n "$RESUMABLE_VERSION" ]; then
              echo "Reusing resumable release tag version: $RESUMABLE_VERSION"
              npm version "$RESUMABLE_VERSION" --no-git-tag-version --allow-same-version
            else
            echo "Bumping version: $VERSION_TYPE (preid=$PREID)"
            npm version "$VERSION_TYPE" --no-git-tag-version --preid="$PREID"
            fi
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

          if [[ "$NEW_VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            if [ "$NPM_TAG" = "latest" ]; then
              echo "ERROR: prereleases may not use the npm latest dist-tag" >&2
              exit 1
            fi
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Sync all package versions and internal dependencies
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = '$NEW_VERSION';

            const packagePaths = ${PACKAGE_PATHS_JSON};

            for (const pkgPath of packagePaths) {
              if (fs.existsSync(pkgPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                pkg.version = version;
                console.log(pkg.name + ' -> v' + version);
                for (const depType of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
                  for (const dep of Object.keys(pkg[depType] || {})) {
                    if (dep.startsWith('@relayfile/')) {
                      // Internal deps pin to exact version (existing convention);
                      // peerDependencies use caret so consumers retain flexibility
                      // (e.g. a future 0.11.x agents must still admit any 0.11.x sdk,
                      // not break under 0.x semver as it would with the previous
                      // peer string left untouched).
                      pkg[depType][dep] = depType === 'peerDependencies' ? '^' + version : version;
                    }
                  }
                }
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
          "

      - name: Test release tooling on the immutable source
        run: npm run test:release

      # Rename each package's `## [Unreleased]` section to `## [X.Y.Z] - <today>`
      # and reopen an empty Unreleased section. Skipped on prereleases and dry
      # runs — prereleases would fragment a single logical release into many
      # changelog entries, and dry runs must not mutate files.
      - name: Finalize CHANGELOGs
        if: |
          steps.bump.outputs.is_prerelease == 'false' &&
          steps.inputs.outputs.dry_run != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/finalize-changelogs.mjs "${{ steps.bump.outputs.new_version }}"

      - name: Build packages
        run: |
          npm run build --workspace=packages/core
          npm run build --workspace=packages/sdk/typescript
          npm run build --workspace=@relayfile/client
          npm run build --workspace=packages/agents
          npm run build --workspace=packages/cli
          npm run build --workspace=packages/local-mount
          npm ci --prefix packages/file-observer
          npm run pages:build --prefix packages/file-observer

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            package.json
            package-lock.json
            packages/core/package.json
            packages/core/dist/
            packages/core/CHANGELOG.md
            packages/sdk/typescript/package.json
            packages/sdk/typescript/dist/
            packages/sdk/typescript/CHANGELOG.md
            packages/client/package.json
            packages/client/dist/
            packages/client/CHANGELOG.md
            packages/agents/package.json
            packages/agents/dist/
            packages/agents/CHANGELOG.md
            packages/cli/package.json
            packages/cli/bin/
            packages/cli/CHANGELOG.md
            packages/file-observer/package.json
            packages/file-observer/CHANGELOG.md
            packages/local-mount/package.json
            packages/local-mount/dist/
            packages/local-mount/CHANGELOG.md
            packages/mount-darwin-arm64/package.json
            packages/mount-darwin-arm64/README.md
            packages/mount-darwin-arm64/bin/.gitkeep
            packages/mount-darwin-x64/package.json
            packages/mount-darwin-x64/README.md
            packages/mount-darwin-x64/bin/.gitkeep
            packages/mount-linux-arm64/package.json
            packages/mount-linux-arm64/README.md
            packages/mount-linux-arm64/bin/.gitkeep
            packages/mount-linux-x64/package.json
            packages/mount-linux-x64/README.md
            packages/mount-linux-x64/bin/.gitkeep
          retention-days: 1

  # Cross-compile relayfile-mount for every consumer-supported platform.
  # These are attached to the GitHub Release so downstream consumers (e.g.
  # the cloud Daytona snapshot rebuild) can pin a specific published version
  # instead of building from source.
  build-mount-binaries:
    name: Build relayfile-mount (${{ matrix.suffix }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    if: needs.build.outputs.release_dry_run != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-amd64
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - suffix: linux-arm64
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - suffix: darwin-amd64
            goos: darwin
            goarch: amd64
            runner: macos-latest
          - suffix: darwin-arm64
            goos: darwin
            goarch: arm64
            runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.source_sha }}"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build relayfile-mount
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          set -euo pipefail
          OUT="relayfile-mount-${{ matrix.suffix }}"
          go build \
            -ldflags="-s -w -X main.relayfileMountVersion=${VERSION}" \
            -o "${OUT}" \
            ./cmd/relayfile-mount
          SIZE=$(stat -f%z "${OUT}" 2>/dev/null || stat -c%s "${OUT}")
          echo "Built ${OUT} (${SIZE} bytes, v${VERSION})"
          if [ "${SIZE}" -lt 1048576 ]; then
            echo "ERROR: binary is suspiciously small (< 1MB)" >&2
            exit 1
          fi

      - name: Smoke-test binary (matching runner only)
        if: |
          (matrix.goos == 'linux' && matrix.goarch == 'amd64') ||
          (matrix.goos == 'darwin' && matrix.goarch == 'arm64')
        run: ./relayfile-mount-${{ matrix.suffix }} --help | head -20

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relayfile-mount-${{ matrix.suffix }}
          path: relayfile-mount-${{ matrix.suffix }}
          retention-days: 1

  # Read-only barrier: every package must reconcile before any package can
  # publish.  This prevents an absent package from publishing while another
  # package in the matrix is still about to fail on a conflicting tarball.
  preflight-packages:
    name: Preflight ${{ matrix.package }}
    needs: [build, build-mount-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.build.outputs.release_dry_run == 'true' || needs.build-mount-binaries.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - package: core
            path: packages/core
            mount_binary: ""
          - package: sdk
            path: packages/sdk/typescript
            mount_binary: ""
          - package: client
            path: packages/client
            mount_binary: ""
          - package: agents
            path: packages/agents
            mount_binary: ""
          - package: cli
            path: packages/cli
            mount_binary: ""
          - package: file-observer
            path: packages/file-observer
            mount_binary: ""
          - package: local-mount
            path: packages/local-mount
            mount_binary: ""
          - package: mount-darwin-arm64
            path: packages/mount-darwin-arm64
            mount_binary: relayfile-mount-darwin-arm64
          - package: mount-darwin-x64
            path: packages/mount-darwin-x64
            mount_binary: relayfile-mount-darwin-amd64
          - package: mount-linux-arm64
            path: packages/mount-linux-arm64
            mount_binary: relayfile-mount-linux-arm64
          - package: mount-linux-x64
            path: packages/mount-linux-x64
            mount_binary: relayfile-mount-linux-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.source_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: .

      - name: Restore CLI binary permissions
        if: matrix.package == 'cli'
        run: chmod 755 packages/cli/bin/relayfile-cli-*

      - name: Download relayfile-mount binary
        if: matrix.mount_binary != '' && needs.build.outputs.release_dry_run != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.mount_binary }}
          path: /tmp/relayfile-mount-binary

      - name: Prepare mount platform package
        if: matrix.mount_binary != '' && needs.build.outputs.release_dry_run != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.path }}/bin"
          cp "/tmp/relayfile-mount-binary/${{ matrix.mount_binary }}" "${{ matrix.path }}/bin/relayfile-mount"
          chmod 755 "${{ matrix.path }}/bin/relayfile-mount"

      - name: Update npm for OIDC support
        run: npm install -g npm@11

      - name: Reconcile package read-only
        env:
          NPM_TAG: ${{ github.event.inputs.tag }}
          RELEASE_DRY_RUN: ${{ needs.build.outputs.release_dry_run }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/release/reconcile-package.mjs" \
            --package-dir "$GITHUB_WORKSPACE/${{ matrix.path }}" \
            --tag "$NPM_TAG" \
            --dry-run "$RELEASE_DRY_RUN" \
            --preflight true \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

  # Publish all packages in parallel after the read-only barrier.
  publish-packages:
    name: Publish ${{ matrix.package }}
    needs: [build, build-mount-binaries, preflight-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      needs.build.outputs.release_package == 'all' &&
      needs.build.result == 'success' &&
      needs.preflight-packages.result == 'success' &&
      (needs.build.outputs.release_dry_run == 'true' || needs.build-mount-binaries.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - package: core
            path: packages/core
            mount_binary: ""
          - package: sdk
            path: packages/sdk/typescript
            mount_binary: ""
          - package: client
            path: packages/client
            mount_binary: ""
          - package: agents
            path: packages/agents
            mount_binary: ""
          - package: cli
            path: packages/cli
            mount_binary: ""
          - package: file-observer
            path: packages/file-observer
            mount_binary: ""
          - package: local-mount
            path: packages/local-mount
            mount_binary: ""
          - package: mount-darwin-arm64
            path: packages/mount-darwin-arm64
            mount_binary: relayfile-mount-darwin-arm64
          - package: mount-darwin-x64
            path: packages/mount-darwin-x64
            mount_binary: relayfile-mount-darwin-amd64
          - package: mount-linux-arm64
            path: packages/mount-linux-arm64
            mount_binary: relayfile-mount-linux-arm64
          - package: mount-linux-x64
            path: packages/mount-linux-x64
            mount_binary: relayfile-mount-linux-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.source_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: .

      - name: Restore CLI binary permissions
        if: matrix.package == 'cli'
        run: chmod 755 packages/cli/bin/relayfile-cli-*

      - name: Download relayfile-mount binary
        if: matrix.mount_binary != '' && needs.build.outputs.release_dry_run != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.mount_binary }}
          path: /tmp/relayfile-mount-binary

      - name: Prepare mount platform package
        if: matrix.mount_binary != '' && needs.build.outputs.release_dry_run != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.path }}/bin"
          cp "/tmp/relayfile-mount-binary/${{ matrix.mount_binary }}" "${{ matrix.path }}/bin/relayfile-mount"
          chmod 755 "${{ matrix.path }}/bin/relayfile-mount"

      # Pinned to the npm 11 line (OIDC needs >= 11.5.1): @latest broke
      # 2026-07-13 when npm 12 dropped support for the runner's node 22.14.
      - name: Update npm for OIDC support
        run: npm install -g npm@11

      - name: Reconcile package with NPM
        env:
          NPM_TAG: ${{ github.event.inputs.tag }}
          RELEASE_DRY_RUN: ${{ needs.build.outputs.release_dry_run }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/package-attestations"
          node "$GITHUB_WORKSPACE/scripts/release/reconcile-package.mjs" \
            --package-dir "$GITHUB_WORKSPACE/${{ matrix.path }}" \
            --tag "$NPM_TAG" \
            --dry-run "$RELEASE_DRY_RUN" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$GITHUB_WORKSPACE/package-attestations/${{ matrix.package }}.json"

      - name: Upload package attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-attestation-${{ matrix.package }}
          path: package-attestations/${{ matrix.package }}.json
          if-no-files-found: error
          retention-days: 1

  # Publish single package (when not 'all')
  publish-single:
    name: Publish single package
    needs: [build, build-mount-binaries, preflight-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      needs.build.outputs.release_package != 'all' &&
      needs.build.result == 'success' &&
      needs.preflight-packages.result == 'success' &&
      (needs.build.outputs.release_dry_run == 'true' || needs.build-mount-binaries.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.source_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: .

      - name: Restore CLI binary permissions
        if: needs.build.outputs.release_package == 'cli'
        run: chmod 755 packages/cli/bin/relayfile-cli-*

      - name: Resolve package path
        id: resolve-package
        env:
          RELEASE_PACKAGE: ${{ needs.build.outputs.release_package }}
        run: |
          case "$RELEASE_PACKAGE" in
            core) echo "path=packages/core" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            sdk) echo "path=packages/sdk/typescript" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            client) echo "path=packages/client" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            agents) echo "path=packages/agents" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            cli) echo "path=packages/cli" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            file-observer) echo "path=packages/file-observer" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            local-mount) echo "path=packages/local-mount" >> "$GITHUB_OUTPUT"; echo "mount_binary=" >> "$GITHUB_OUTPUT" ;;
            mount-darwin-arm64) echo "path=packages/mount-darwin-arm64" >> "$GITHUB_OUTPUT"; echo "mount_binary=relayfile-mount-darwin-arm64" >> "$GITHUB_OUTPUT" ;;
            mount-darwin-x64) echo "path=packages/mount-darwin-x64" >> "$GITHUB_OUTPUT"; echo "mount_binary=relayfile-mount-darwin-amd64" >> "$GITHUB_OUTPUT" ;;
            mount-linux-arm64) echo "path=packages/mount-linux-arm64" >> "$GITHUB_OUTPUT"; echo "mount_binary=relayfile-mount-linux-arm64" >> "$GITHUB_OUTPUT" ;;
            mount-linux-x64) echo "path=packages/mount-linux-x64" >> "$GITHUB_OUTPUT"; echo "mount_binary=relayfile-mount-linux-amd64" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported package: $RELEASE_PACKAGE" >&2
              exit 1
              ;;
          esac

      - name: Download relayfile-mount binary
        if: steps.resolve-package.outputs.mount_binary != '' && needs.build.outputs.release_dry_run != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.resolve-package.outputs.mount_binary }}
          path: /tmp/relayfile-mount-binary

      - name: Prepare mount platform package
        if: steps.resolve-package.outputs.mount_binary != '' && needs.build.outputs.release_dry_run != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.resolve-package.outputs.path }}/bin"
          cp "/tmp/relayfile-mount-binary/${{ steps.resolve-package.outputs.mount_binary }}" "${{ steps.resolve-package.outputs.path }}/bin/relayfile-mount"
          chmod 755 "${{ steps.resolve-package.outputs.path }}/bin/relayfile-mount"

      # Pinned to the npm 11 line (OIDC needs >= 11.5.1): @latest broke
      # 2026-07-13 when npm 12 dropped support for the runner's node 22.14.
      - name: Update npm for OIDC support
        run: npm install -g npm@11

      - name: Reconcile package with NPM
        env:
          NPM_TAG: ${{ github.event.inputs.tag }}
          RELEASE_DRY_RUN: ${{ needs.build.outputs.release_dry_run }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/package-attestations"
          node "$GITHUB_WORKSPACE/scripts/release/reconcile-package.mjs" \
            --package-dir "$GITHUB_WORKSPACE/${{ steps.resolve-package.outputs.path }}" \
            --tag "$NPM_TAG" \
            --dry-run "$RELEASE_DRY_RUN" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$GITHUB_WORKSPACE/package-attestations/${{ needs.build.outputs.release_package }}.json"

      - name: Upload package attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-attestation-${{ needs.build.outputs.release_package }}
          path: package-attestations/${{ needs.build.outputs.release_package }}.json
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create Release
    needs: [build, preflight-packages, publish-packages, publish-single, build-mount-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      needs.build.outputs.release_dry_run != 'true' &&
      needs.build-mount-binaries.result == 'success' &&
      (needs.publish-packages.result == 'success' || needs.publish-single.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: true

      - name: Verify immutable source snapshot
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.source_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: .

      - name: Download relayfile-mount binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: relayfile-mount-*
          path: mount-binaries
          merge-multiple: true

      - name: Download package attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-attestation-*
          path: package-attestations
          merge-multiple: true

      - name: Verify mount binaries present
        run: |
          set -euo pipefail
          ls -la mount-binaries/
          for SUFFIX in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            if [ ! -f "mount-binaries/relayfile-mount-${SUFFIX}" ]; then
              echo "ERROR: mount-binaries/relayfile-mount-${SUFFIX} missing"
              exit 1
            fi
          done
          chmod +x mount-binaries/relayfile-mount-*
          test -d package-attestations
          test "$(find package-attestations -type f -name '*.json' | wc -l | tr -d ' ')" -eq 11
          for BINARY in \
            relayfile-mount-linux-amd64 \
            relayfile-mount-linux-arm64 \
            relayfile-mount-darwin-amd64 \
            relayfile-mount-darwin-arm64 \
            relayfile-cli-linux-amd64 \
            relayfile-cli-linux-arm64 \
            relayfile-cli-darwin-amd64 \
            relayfile-cli-darwin-arm64 \
            relayfile-cli-windows-amd64.exe \
            relayfile-cli-windows-arm64.exe; do
            case "$BINARY" in
              relayfile-mount-*) test -f "mount-binaries/$BINARY" ;;
              *) test -f "packages/cli/bin/$BINARY" ;;
            esac
          done
          test "$(find mount-binaries -maxdepth 1 -type f -name 'relayfile-mount-*' | wc -l | tr -d ' ')" -eq 4
          test "$(find packages/cli/bin -maxdepth 1 -type f -name 'relayfile-cli-*' | wc -l | tr -d ' ')" -eq 6

      - name: Generate checksums
        run: |
          set -euo pipefail
          # Publish a checksums.txt alongside the release binaries. Downstream
          # consumers (e.g. agent-relay's relayfile-binary.ts verifyChecksum)
          # require it and match entries by basename, so we cd into each dir to
          # emit basenames (not paths). This is mandatory for the cloud Daytona
          # mount daemon download to verify; do not drop it.
          ( cd mount-binaries && sha256sum relayfile-mount-* ) > checksums.txt
          ( cd packages/cli/bin && sha256sum relayfile-cli-* ) >> checksums.txt
          cat checksums.txt

      # `npm publish` returning success only means the registry accepted the
      # write; the packument that `npm install` reads is CDN-cached and catches
      # up seconds later. Regenerating packages/sdk/typescript's lockfile inside
      # that window killed this job three times (0.10.51, 0.10.53, 0.10.54) —
      # each time *after* the packages were already public, leaving npm ahead of
      # the repo with no tag. The script waits for propagation, and retries only
      # when the unresolvable spec is an internal package of *this* release; a
      # version that was never published still fails the job.
      - name: Regenerate release lockfiles
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.new_version }}
        run: node scripts/release/regenerate-release-lockfiles.mjs "$RELEASE_VERSION"

      - name: Commit version bump and prepare tag target
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          git add \
            package.json package-lock.json \
            packages/core/package.json packages/core/CHANGELOG.md \
            packages/sdk/typescript/package.json packages/sdk/typescript/package-lock.json packages/sdk/typescript/CHANGELOG.md \
            packages/client/package.json packages/client/CHANGELOG.md \
            packages/agents/package.json packages/agents/CHANGELOG.md \
            packages/cli/package.json packages/cli/CHANGELOG.md \
            packages/file-observer/package.json packages/file-observer/CHANGELOG.md \
            packages/local-mount/package.json packages/local-mount/CHANGELOG.md \
            packages/mount-darwin-arm64/package.json packages/mount-darwin-x64/package.json \
            packages/mount-linux-arm64/package.json packages/mount-linux-x64/package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): v${NEW_VERSION}"
          fi

          INTENDED_TREE=$(git rev-parse 'HEAD^{tree}')
          if git show-ref --verify --quiet "refs/tags/v${NEW_VERSION}"; then
            TAG_COMMIT=$(git rev-list -n 1 "refs/tags/v${NEW_VERSION}")
            TAG_PARENTS=$(git rev-list --parents -n 1 "$TAG_COMMIT")
            test "$(printf '%s\n' "$TAG_PARENTS" | awk '{print NF}')" -eq 2
            TAG_PARENT=$(printf '%s\n' "$TAG_PARENTS" | cut -d' ' -f2)
            TAG_TREE=$(git rev-parse "${TAG_COMMIT}^{tree}")
            test "$TAG_PARENT" = "$SOURCE_SHA"
            test "$TAG_TREE" = "$INTENDED_TREE"
            TAG_EXISTS=true
            echo "Reusing existing tag v${NEW_VERSION} at $TAG_COMMIT with the intended tree"
          else
            TAG_COMMIT=$(git rev-parse HEAD)
            TAG_EXISTS=false
            TAG_PARENTS=$(git rev-list --parents -n 1 "$TAG_COMMIT")
            test "$(printf '%s\n' "$TAG_PARENTS" | awk '{print NF}')" -eq 2
            test "$(printf '%s\n' "$TAG_PARENTS" | cut -d' ' -f2)" = "$SOURCE_SHA"
          fi
          echo "TAG_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
          echo "TAG_EXISTS=$TAG_EXISTS" >> "$GITHUB_ENV"

      - name: Generate release attestation
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.new_version }}
          NPM_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          test -n "${TAG_COMMIT:-}"
          node scripts/release/create-release-attestation.mjs \
            --package-dir package-attestations \
            --checksums checksums.txt \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$RELEASE_VERSION" \
            --tag "v$RELEASE_VERSION" \
            --tag-commit "$TAG_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-attestation.json

      - name: Create and push release tag
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          set -euo pipefail
          if [ "${TAG_EXISTS:-false}" = "true" ]; then
            test "$(git rev-list -n 1 "refs/tags/v${NEW_VERSION}")" = "$TAG_COMMIT"
            exit 0
          fi
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "refs/tags/v${NEW_VERSION}:refs/tags/v${NEW_VERSION}"
          test "$(git rev-list -n 1 "refs/tags/v${NEW_VERSION}")" = "$TAG_COMMIT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.new_version }}
          name: v${{ needs.build.outputs.new_version }}
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          body: |
            ## relayfile v${{ needs.build.outputs.new_version }}

            ### Packages
            - `@relayfile/core@${{ needs.build.outputs.new_version }}`
            - `@relayfile/sdk@${{ needs.build.outputs.new_version }}`
            - `@relayfile/client@${{ needs.build.outputs.new_version }}`
            - `@relayfile/agents@${{ needs.build.outputs.new_version }}`
            - `relayfile@${{ needs.build.outputs.new_version }}`
            - `@relayfile/file-observer@${{ needs.build.outputs.new_version }}`
            - `@relayfile/local-mount@${{ needs.build.outputs.new_version }}`
            - `@relayfile/mount-darwin-arm64@${{ needs.build.outputs.new_version }}`
            - `@relayfile/mount-darwin-x64@${{ needs.build.outputs.new_version }}`
            - `@relayfile/mount-linux-arm64@${{ needs.build.outputs.new_version }}`
            - `@relayfile/mount-linux-x64@${{ needs.build.outputs.new_version }}`

            ### Install
            ```bash
            npm install @relayfile/sdk@${{ needs.build.outputs.new_version }}
            npm install @relayfile/client@${{ needs.build.outputs.new_version }}
            npm install @relayfile/agents@${{ needs.build.outputs.new_version }}
            npm install relayfile@${{ needs.build.outputs.new_version }}
            npm install @relayfile/file-observer@${{ needs.build.outputs.new_version }}
            npm install @relayfile/local-mount@${{ needs.build.outputs.new_version }}
            npm install @relayfile/sdk@${{ needs.build.outputs.new_version }} --include=optional
            ```

            ### Binaries

            Cross-compiled `relayfile-mount` binaries are attached to this
            release for linux/amd64, linux/arm64, darwin/amd64, and darwin/arm64.
            Downstream consumers (e.g. the cloud Daytona snapshot) can pin a
            specific tag and `curl` the binary directly:

            ```bash
            curl -fSL -o relayfile-mount \
              https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.new_version }}/relayfile-mount-linux-amd64
            chmod +x relayfile-mount
            ```

            ### Publish Details
            - Dist-tag: `${{ github.event.inputs.tag }}`
            - Provenance: enabled via `npm publish --provenance`
            - Registry: `https://registry.npmjs.org`
          files: |
            packages/cli/bin/relayfile-cli-*
            mount-binaries/relayfile-mount-*
            checksums.txt
            release-attestation.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Summary
    needs:
      [
        build,
        publish-packages,
        publish-single,
        build-mount-binaries,
        create-release,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()

    steps:
      - name: Summary
        env:
          RELEASE_PACKAGE: ${{ needs.build.outputs.release_package }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_DRY_RUN: ${{ needs.build.outputs.release_dry_run }}
        run: |
          {
            echo "## Publish Summary"
            echo ""
            echo "**Package**: \`$RELEASE_PACKAGE\`"
            echo "**Version**: \`${{ needs.build.outputs.new_version }}\`"
            echo "**NPM Tag**: \`$RELEASE_TAG\`"
            echo "**Prerelease**: \`${{ needs.build.outputs.is_prerelease }}\`"
            echo "**Dry Run**: \`$RELEASE_DRY_RUN\`"
            echo "**Provenance**: \`enabled\`"
            echo ""
            echo "### Results"
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| Build & Version | ${{ needs.build.result == 'success' && 'SUCCESS' || 'FAILURE' }} |"
            echo "| Publish All | ${{ needs.publish-packages.result == 'success' && 'SUCCESS' || (needs.publish-packages.result == 'skipped' && 'SKIPPED' || 'FAILURE') }} |"
            echo "| Publish Single | ${{ needs.publish-single.result == 'success' && 'SUCCESS' || (needs.publish-single.result == 'skipped' && 'SKIPPED' || 'FAILURE') }} |"
            echo "| Build Mount Binaries | ${{ needs.build-mount-binaries.result == 'success' && 'SUCCESS' || (needs.build-mount-binaries.result == 'skipped' && 'SKIPPED' || 'FAILURE') }} |"
            echo "| Create Release | ${{ needs.create-release.result == 'success' && 'SUCCESS' || (needs.create-release.result == 'skipped' && 'SKIPPED' || 'FAILURE') }} |"
          } >> "$GITHUB_STEP_SUMMARY"
